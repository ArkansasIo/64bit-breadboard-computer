name: Assembly Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Assemble standalone examples
        run: |
          mkdir -p build
          nasm -f elf64 asm/examples/fibonacci.asm -o build/fibonacci.o
      - name: Check bootstrap scaffold syntax
        run: |
          nasm -f bin asm/boot/stage1.asm -o build/stage1.bin
          test "$(wc -c < build/stage1.bin)" -eq 512
      - name: Upload assembly outputs
        uses: actions/upload-artifact@v4
        with:
          name: x86-64-assembly-checks
          path: build/
